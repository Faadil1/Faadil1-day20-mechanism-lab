<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 20 — Mechanism Study</title>
<style>
:root{
  --bg:#f3efe6;--paper:#fffdf8;--ink:#171716;--muted:#716c63;--line:#d3cbbc;
  --soft:#e9e2d6;--accent:#ff5a36;--shadow:0 18px 50px rgba(32,27,20,.07)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}
main{max-width:1040px;margin:auto;padding:28px 22px 64px}
header{padding:16px 0 28px;border-bottom:1px solid var(--line)}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(40px,7vw,78px);line-height:.94;letter-spacing:-.05em;margin:10px 0 12px}
h2{font-size:clamp(30px,4.7vw,54px);line-height:1;letter-spacing:-.04em;margin:8px 0 12px}
h3{font-size:15px;margin:0 0 10px;letter-spacing:.04em;text-transform:uppercase}
p{font-size:16px;line-height:1.55;color:var(--muted);margin:8px 0 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}
.btn,.tabs button{
  border:1px solid var(--line);background:rgba(255,255,255,.4);color:var(--ink);
  padding:11px 15px;border-radius:999px;cursor:pointer;transition:.18s ease
}
.btn:hover,.tabs button:hover{transform:translateY(-1px);border-color:#8d877d}
.btn.primary,.tabs button.on{background:var(--ink);color:white;border-color:var(--ink)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.panel{display:none}.panel.on{display:block}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:26px;margin:18px 0;box-shadow:var(--shadow)}
.stage{min-height:360px;display:flex;flex-direction:column;justify-content:center}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.intent-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}
.intent{padding:18px;border:1px solid var(--line);border-radius:16px;background:transparent;text-align:left;cursor:pointer}
.intent:hover{border-color:var(--ink)}
.progress{display:flex;gap:6px;margin-bottom:18px}
.dot{width:8px;height:8px;border-radius:99px;background:var(--soft)}
.dot.done{background:var(--ink)}.dot.now{background:var(--accent)}
.item-meta{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.item-title{font-size:clamp(34px,5vw,62px);line-height:.95;letter-spacing:-.045em;margin:12px 0}
.item-copy{max-width:720px;font-size:19px;line-height:1.5;color:#4d4942}
.action-row{display:flex;gap:9px;margin-top:28px;flex-wrap:wrap}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.compare-card{border:1px solid var(--line);border-radius:18px;padding:20px;background:#fbf8f0}
.metric{margin:13px 0}
.metric-head{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.bar{height:9px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:7px}
.fill{height:100%;background:var(--ink);border-radius:99px}
.notice{padding:15px 17px;border-radius:15px;background:#f0eadf;border:1px solid var(--line);margin-top:18px}
.net{height:520px;background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
svg{width:100%;height:100%}
.edge{stroke:#d4cec2;stroke-width:1.4;transition:all .55s cubic-bezier(.2,.8,.2,1)}
.node{cursor:pointer;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.node circle{fill:var(--paper);stroke:var(--ink);stroke-width:1.3}
.node.visited circle{fill:var(--ink)}
.node .letter{font-size:11px;text-anchor:middle;dominant-baseline:middle}
.node.visited .letter{fill:white}
.node .label{font-size:11px;text-anchor:middle;fill:var(--muted)}
.ghost circle{fill:none;stroke:#bdb5a7;stroke-width:1;stroke-dasharray:3 4}
.ghost text{font-size:10px;fill:#aaa29a;text-anchor:middle}
.shift{stroke:var(--accent);stroke-width:1;stroke-dasharray:4 5;opacity:.55}
.map-footer{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-top:12px}
.map-message{min-height:44px;color:var(--muted);font-size:14px}
.recall-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.pick{border:1px solid var(--line);border-radius:16px;background:transparent;padding:16px;text-align:left;cursor:pointer}
.pick:hover{border-color:var(--ink)}
.trace-table{width:100%;border-collapse:collapse;margin-top:14px}
.trace-table td,.trace-table th{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;font-size:13px}
.trace-table th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.debug{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;background:#111;color:#eee;padding:15px;border-radius:16px;max-height:360px;overflow:auto}
.hidden{display:none!important}
@media(max-width:700px){
  main{padding:18px 14px 50px}.intent-grid,.compare,.recall-grid{grid-template-columns:1fr}.card{padding:20px}
  .net{height:480px}.map-footer{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<main>
<header>
  <div class="kicker" id="topKicker">INTERACTION STUDY</div>
  <h1 id="topTitle">Try this short experiment.</h1>
  <p id="topSub">Use it however feels natural. There is no correct way to interact.</p>
</header>

<div class="tabs" id="tabs">
  <button class="on" data-p="a">A</button>
  <button data-p="b">B</button>
  <button data-p="c">C</button>
  <button data-p="log">Evidence log</button>
</div>

<section id="a" class="panel on">
  <div id="aStage"></div>
</section>

<section id="b" class="panel">
  <div id="bStage"></div>
</section>

<section id="c" class="panel">
  <div id="cStage"></div>
</section>

<section id="log" class="panel">
  <div class="card">
    <div class="kicker">LOCAL SESSION DATA</div>
    <h2>Evidence log</h2>
    <p>For internal inspection only. No data leaves this page.</p>
    <div class="row" style="margin-top:18px"><button class="btn" id="reset">Reset</button></div>
  </div>
  <pre class="debug" id="trace"></pre>
</section>
</main>

<script>
const q=new URLSearchParams(location.search);
const BLIND=q.get("blind")==="1";
const PROBE=q.get("probe");
const PID=q.get("pid")||"anon";
const DEBUG=q.get("debug")==="1";
const store=BLIND?sessionStorage:localStorage;
const storeKey="day20-v02-"+(PROBE||"lab")+"-"+PID;

const corpus=[
{id:"A",title:"Signal Garden",short:"Signal Garden",topic:"systems",depth:.86,novelty:.45,light:.25,text:"A tiny ecosystem where simple rules produce outcomes nobody selected directly."},
{id:"B",title:"Broken Compass",short:"Broken Compass",topic:"navigation",depth:.54,novelty:.82,light:.48,text:"A map can tell you exactly where you are while remaining silent about why you arrived."},
{id:"C",title:"Soft Machines",short:"Soft Machines",topic:"design",depth:.38,novelty:.55,light:.83,text:"Some interfaces reveal themselves slowly instead of demanding an immediate response."},
{id:"D",title:"Deep Time",short:"Deep Time",topic:"history",depth:.97,novelty:.62,light:.18,text:"A long view of systems that change faster than people can develop language for them."},
{id:"E",title:"Small Rituals",short:"Small Rituals",topic:"culture",depth:.43,novelty:.44,light:.91,text:"Tiny repeated acts can become meaningful before anyone formalizes what they mean."},
{id:"F",title:"Strange Attractors",short:"Strange Attractors",topic:"science",depth:.73,novelty:.96,light:.34,text:"Patterns can look random until you stop assuming the system is moving in straight lines."},
{id:"G",title:"Repair Manual",short:"Repair Manual",topic:"practice",depth:.78,novelty:.36,light:.32,text:"Repair exposes assumptions that polished objects usually hide from the person using them."},
{id:"H",title:"Drift",short:"Drift",topic:"media",depth:.41,novelty:.88,light:.67,text:"Sometimes you notice the destination before you notice that you stopped choosing the turns."}
];
const targets={
  learn:{depth:.82,novelty:.45,light:.28},
  surprise:{depth:.52,novelty:.92,light:.48},
  relax:{depth:.30,novelty:.40,light:.92},
  deep:{depth:.98,novelty:.50,light:.18}
};
const labels={learn:"LEARN SOMETHING",surprise:"BE SURPRISED",relax:"RELAX",deep:"GO DEEP"};

let S={log:[],a:{},b:{},c:{}};
try{const saved=store.getItem(storeKey);if(saved)S=JSON.parse(saved)}catch(e){}

function save(){
  store.setItem(storeKey,JSON.stringify(S));
  const el=document.getElementById("trace");
  if(el)el.textContent=JSON.stringify(S.log,null,2);
}
function ev(type,data={}){
  const e={t:new Date().toISOString(),type,...data};
  S.log.push(e);save();return e;
}
function dots(i,total){
  return '<div class="progress">'+Array.from({length:total},(_,n)=>'<span class="dot '+(n<i?'done':n===i?'now':'')+'"></span>').join("")+'</div>';
}
function pct(x){return Math.round(x*100)}
function metric(label,value){
  return '<div class="metric"><div class="metric-head"><span>'+label+'</span><span>'+pct(value)+'</span></div><div class="bar"><div class="fill" style="width:'+pct(value)+'%"></div></div></div>';
}

document.querySelectorAll(".tabs button").forEach(btn=>btn.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("on"));
  btn.classList.add("on");
  document.getElementById(btn.dataset.p).classList.add("on");
  ev("panel_open",{panel:btn.dataset.p});
  if(btn.dataset.p==="a")renderA();
  if(btn.dataset.p==="b")renderB();
  if(btn.dataset.p==="c")renderC();
});

// A
function scoreA(item,w){return item.depth*w.depth+item.novelty*w.novelty+item.light*w.light}
function renderA(){
  const box=document.getElementById("aStage");
  if(!S.a.intent){
    box.innerHTML='<div class="card stage"><div class="kicker blind-label">SESSION</div><h2>What do you want this time to be for?</h2><p>Choose the closest answer. You can change your mind later.</p><div class="intent-grid" id="intentGrid"></div></div>';
    const grid=document.getElementById("intentGrid");
    Object.keys(labels).forEach(k=>{
      const b=document.createElement("button");b.className="intent";b.innerHTML='<strong>'+labels[k]+'</strong>';
      b.onclick=()=>startA(k);grid.appendChild(b);
    });
    return;
  }
  if(S.a.i>=6){renderAReveal();return}
  const left=corpus.filter(x=>!S.a.seen.includes(x.id)).sort((x,y)=>scoreA(y,S.a.weights)-scoreA(x,S.a.weights));
  const item=left[0];
  box.innerHTML='<div class="card stage">'+dots(S.a.i,6)+'<div class="item-meta">'+item.topic+'</div><div class="item-title">'+item.title+'</div><div class="item-copy">'+item.text+'</div><div class="action-row"><button class="btn primary" data-a="next">NEXT</button><button class="btn" data-a="keep">KEEP</button><button class="btn" data-a="pass">PASS</button></div></div>';
  box.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>actA(item,b.dataset.a));
}
function startA(intent){
  S.a={intent,i:0,weights:{depth:.5,novelty:.5,light:.5},seen:[]};
  ev("a_intent",{intent});renderA();
}
function actA(item,act){
  const delta=act==="keep"?.15:act==="pass"?-.10:.03;
  S.a.seen.push(item.id);S.a.i++;
  ["depth","novelty","light"].forEach(k=>{
    S.a.weights[k]=Math.max(.05,Math.min(.95,S.a.weights[k]+delta*(item[k]-.5)*2));
  });
  ev("a_behavior",{item:item.id,action:act,model_after:{...S.a.weights}});
  renderA();
}
function renderAReveal(){
  const t=targets[S.a.intent],w=S.a.weights;
  ev("a_complete",{stated:S.a.intent,model:{...w}});
  document.getElementById("aStage").innerHTML='<div class="card"><div class="kicker">SESSION COMPLETE</div><h2>Two signals came out of the same session.</h2><div class="compare"><div class="compare-card"><h3>You chose at the start</h3><div class="item-title" style="font-size:32px">'+labels[S.a.intent]+'</div>'+metric("go deep",t.depth)+metric("seek novelty",t.novelty)+metric("keep it light",t.light)+'</div><div class="compare-card"><h3>System state after 6 actions</h3>'+metric("go deep",w.depth)+metric("seek novelty",w.novelty)+metric("keep it light",w.light)+'</div></div></div>';
}

// B
const base={A:[110,250],B:[300,105],C:[310,385],D:[555,95],E:[540,245],F:[610,380],G:[800,185],H:[785,365]};
const edges=[["A","B"],["A","C"],["B","D"],["B","E"],["C","E"],["C","F"],["D","G"],["E","G"],["E","H"],["F","H"]];
function startB(){
  S.b={started:true,visits:{},unique:[],pos:JSON.parse(JSON.stringify(base)),initial:JSON.parse(JSON.stringify(base)),moves:[],targetMode:false,complete:false};
  ev("b_start");renderB();
}
function renderB(){
  const box=document.getElementById("bStage");
  if(!S.b.started){
    box.innerHTML='<div class="card stage"><div class="kicker blind-label">SESSION</div><h2>Explore the map.</h2><p>Select anything that draws your attention. The map is yours to move through.</p><div class="action-row"><button class="btn primary" id="startB">START</button></div></div>';
    document.getElementById("startB").onclick=startB;return;
  }
  if(S.b.complete){renderBFinish();return}
  const unique=S.b.unique.length;
  if(unique>=4)S.b.targetMode=true;
  box.innerHTML='<div class="card" style="box-shadow:none;background:transparent;border:0;padding:0"><div class="kicker">'+(S.b.targetMode?"ONE LAST TASK":"EXPLORE")+'</div><h2>'+(S.b.targetMode?"Find Deep Time again.":"Choose what to visit next.")+'</h2><p>'+(S.b.targetMode?"Use the map as it is now.":"Visit at least four different places.")+'</p></div><div class="net"><svg id="map" viewBox="0 0 900 520"></svg></div><div class="map-footer"><div class="map-message" id="bMsg">'+(S.b.lastText||"")+'</div><div class="kicker">'+unique+' / 4 explored</div></div>';
  drawB();
}
function drawB(){
  const svg=document.getElementById("map");if(!svg)return;svg.innerHTML="";
  edges.forEach(([a,b])=>{
    const p=S.b.pos[a],r=S.b.pos[b];
    const l=document.createElementNS("http://www.w3.org/2000/svg","line");
    l.setAttribute("x1",p[0]);l.setAttribute("y1",p[1]);l.setAttribute("x2",r[0]);l.setAttribute("y2",r[1]);l.setAttribute("class","edge");svg.appendChild(l);
  });
  corpus.forEach(item=>{
    const p=S.b.pos[item.id];
    const g=document.createElementNS("http://www.w3.org/2000/svg","g");
    g.setAttribute("class","node "+(S.b.visits[item.id]?"visited":""));
    g.setAttribute("transform","translate("+p[0]+","+p[1]+")");
    const c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("r","28");
    const letter=document.createElementNS("http://www.w3.org/2000/svg","text");letter.setAttribute("class","letter");letter.textContent=item.id;
    const label=document.createElementNS("http://www.w3.org/2000/svg","text");label.setAttribute("class","label");label.setAttribute("y","48");label.textContent=item.short;
    g.append(c,letter,label);g.onclick=()=>visitB(item);svg.appendChild(g);
  });
}
function visitB(item){
  if(S.b.targetMode&&item.id==="D"){
    S.b.complete=true;ev("b_target_found",{target:"D",unique_visits:S.b.unique.length});renderB();return;
  }
  S.b.visits[item.id]=(S.b.visits[item.id]||0)+1;
  if(!S.b.unique.includes(item.id))S.b.unique.push(item.id);
  const anchor=S.b.pos[item.id];
  corpus.forEach(o=>{
    if(o.id===item.id)return;
    const sim=1-Math.abs(o.depth-item.depth)*.34-Math.abs(o.novelty-item.novelty)*.33-Math.abs(o.light-item.light)*.33;
    if(sim>.72){
      const p=S.b.pos[o.id],old=[...p];
      p[0]+=(anchor[0]-p[0])*.12;p[1]+=(anchor[1]-p[1])*.12;
      S.b.moves.push({because:item.id,moved:o.id,from:old,to:[...p]});
    }
  });
  S.b.lastText=item.title+" — "+item.text;
  ev("b_visit",{item:item.id,coordinate_changes:S.b.moves.slice(-4)});
  renderB();
}
function renderBFinish(){
  const svgId="mapFinish";
  document.getElementById("bStage").innerHTML='<div class="card" style="box-shadow:none;background:transparent;border:0;padding:0"><div class="kicker">ROUTE COMPLETE</div><h2>The map did not end where it started.</h2><p>Faint circles show the starting positions. Solid circles show the final positions.</p></div><div class="net"><svg id="'+svgId+'" viewBox="0 0 900 520"></svg></div>';
  const svg=document.getElementById(svgId);
  corpus.forEach(item=>{
    const a=S.b.initial[item.id],b=S.b.pos[item.id];
    const line=document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1",a[0]);line.setAttribute("y1",a[1]);line.setAttribute("x2",b[0]);line.setAttribute("y2",b[1]);line.setAttribute("class","shift");svg.appendChild(line);
    const ghost=document.createElementNS("http://www.w3.org/2000/svg","g");ghost.setAttribute("class","ghost");ghost.setAttribute("transform","translate("+a[0]+","+a[1]+")");
    const gc=document.createElementNS("http://www.w3.org/2000/svg","circle");gc.setAttribute("r","24");const gt=document.createElementNS("http://www.w3.org/2000/svg","text");gt.setAttribute("y","44");gt.textContent=item.short;ghost.append(gc,gt);svg.appendChild(ghost);
  });
  edges.forEach(([a,b])=>{
    const p=S.b.pos[a],r=S.b.pos[b],l=document.createElementNS("http://www.w3.org/2000/svg","line");
    l.setAttribute("x1",p[0]);l.setAttribute("y1",p[1]);l.setAttribute("x2",r[0]);l.setAttribute("y2",r[1]);l.setAttribute("class","edge");svg.appendChild(l);
  });
  corpus.forEach(item=>{
    const p=S.b.pos[item.id],g=document.createElementNS("http://www.w3.org/2000/svg","g");g.setAttribute("class","node visited");g.setAttribute("transform","translate("+p[0]+","+p[1]+")");
    const c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("r","28");const t=document.createElementNS("http://www.w3.org/2000/svg","text");t.setAttribute("class","letter");t.textContent=item.id;g.append(c,t);svg.appendChild(g);
  });
  ev("b_complete",{unique_visits:S.b.unique.length,total_moves:S.b.moves.length});
}

// C
function startC(){
  S.c={started:true,i:0,sequence:[],third:null,bias:0,behaviors:[],shownAt:null,recall:null,complete:false};
  ev("c_start");renderC();
}
function chooseC(){
  const left=corpus.filter(x=>!S.c.sequence.includes(x.id)).sort((a,b)=>(b.novelty+S.c.bias*b.depth)-(a.novelty+S.c.bias*a.depth));
  return left[0];
}
function renderC(){
  const box=document.getElementById("cStage");
  if(!S.c.started){
    box.innerHTML='<div class="card stage"><div class="kicker blind-label">SESSION</div><h2>View a short sequence.</h2><p>Read naturally. Move on whenever you want.</p><div class="action-row"><button class="btn primary" id="startC">START</button></div></div>';
    document.getElementById("startC").onclick=startC;return;
  }
  if(S.c.i>=6&&!S.c.recall){renderCRecall();return}
  if(S.c.recall&&!S.c.complete){renderCCause();return}
  if(S.c.complete){renderCFinish();return}
  const item=chooseC();
  S.c.current=item.id;
  if(!S.c.sequence.includes(item.id)){
    S.c.sequence.push(item.id);S.c.i++;
    if(S.c.i===3)S.c.third=item.id;
    ev("c_exposure",{position:S.c.i,item:item.id,bias_before:S.c.bias});
  }
  S.c.shownAt=performance.now();
  box.innerHTML='<div class="card stage">'+dots(S.c.i-1,6)+'<div class="item-meta">'+item.topic+'</div><div class="item-title">'+item.title+'</div><div class="item-copy">'+item.text+'</div><div class="action-row"><button class="btn primary" id="nextC">NEXT</button></div></div>';
  document.getElementById("nextC").onclick=nextC;
}
function nextC(){
  const seconds=Math.max(.1,(performance.now()-S.c.shownAt)/1000);
  const effect=seconds<2?-.15:seconds>5?.30:0;
  S.c.bias=Math.max(-.6,Math.min(.9,S.c.bias+effect));
  S.c.behaviors.push({item:S.c.current,seconds:+seconds.toFixed(1),effect});
  ev("c_behavior",{item:S.c.current,dwell_seconds:+seconds.toFixed(1),model_effect:effect,bias_after:S.c.bias});
  renderC();
}
function renderCRecall(){
  const picks=corpus.slice(0,6);
  if(!picks.some(x=>x.id===S.c.third))picks[0]=corpus.find(x=>x.id===S.c.third);
  document.getElementById("cStage").innerHTML='<div class="card"><div class="kicker">MEMORY</div><h2>Go back to the third thing you saw.</h2><div class="recall-grid" id="recallGrid"></div></div>';
  const grid=document.getElementById("recallGrid");
  picks.forEach(x=>{
    const b=document.createElement("button");b.className="pick";b.innerHTML='<strong>'+x.title+'</strong><br><span style="color:var(--muted)">'+x.topic+'</span>';
    b.onclick=()=>{S.c.recall={picked:x.id,correct:x.id===S.c.third};ev("c_recall",S.c.recall);renderC();};grid.appendChild(b);
  });
}
function renderCCause(){
  const ok=S.c.recall.correct;
  document.getElementById("cStage").innerHTML='<div class="card"><div class="kicker">'+(ok?"FOUND":"NOT THE ONE")+'</div><h2>Why do you think that item appeared third?</h2><div class="recall-grid" id="causeGrid"></div></div>';
  const options=["The order was fixed","Because of how I moved through the earlier cards","Because that topic was always next","I can't tell"];
  const grid=document.getElementById("causeGrid");
  options.forEach(x=>{
    const b=document.createElement("button");b.className="pick";b.textContent=x;b.onclick=()=>{S.c.causalGuess=x;S.c.complete=true;ev("c_causal_guess",{answer:x});renderC();};grid.appendChild(b);
  });
}
function renderCFinish(){
  const firstTwo=S.c.behaviors.slice(0,2);
  document.getElementById("cStage").innerHTML='<div class="card"><div class="kicker">SESSION COMPLETE</div><h2>The sequence reacted to time.</h2><p>The next card was ranked using each item\'s novelty plus a small bias derived from time spent on earlier cards.</p><table class="trace-table"><thead><tr><th>Earlier card</th><th>Time</th><th>Model effect</th></tr></thead><tbody>'+firstTwo.map(x=>'<tr><td>'+corpus.find(c=>c.id===x.item).title+'</td><td>'+x.seconds+'s</td><td>'+(x.effect>0?"+":x.effect<0?"−":"0")+'</td></tr>').join("")+'</tbody></table><div class="notice"><strong>Third item:</strong> '+corpus.find(x=>x.id===S.c.third).title+'</div></div>';
  ev("c_complete",{third:S.c.third,first_two:firstTwo,guess:S.c.causalGuess});
}

function applyMode(){
  if(!BLIND){
    document.getElementById("topKicker").textContent="DAY 20 / MECHANISM STUDY";
    document.getElementById("topTitle").innerHTML="Behavior is evidence.<br>It is not intention.";
    document.getElementById("topSub").textContent="Three small experiments about what a system can observe, infer, and change.";
    return;
  }
  document.getElementById("tabs").classList.add("hidden");
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("on"));
  if(["a","b","c"].includes(PROBE))document.getElementById(PROBE).classList.add("on");
  document.querySelectorAll(".blind-label").forEach(x=>x.textContent="");
}

document.getElementById("reset").onclick=()=>{store.removeItem(storeKey);location.reload()};
applyMode();
renderA();renderB();renderC();save();
</script>
