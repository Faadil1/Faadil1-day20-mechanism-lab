name: D4 spatial vertical slice

on:
  push:
    branches:
      - build/d4-spatial-vertical-slice
      - design/d4-runtime-fidelity-v1
  pull_request:
    branches:
      - preconcept/comparative-mechanism-proof

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Model tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
